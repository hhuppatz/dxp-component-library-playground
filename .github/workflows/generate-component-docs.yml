name: Generate Component Documentation

on:
  push:
    paths:
      - 'dxp/component-service/**'
  workflow_dispatch:

# NOTE: This workflow also generates documentation for any component that is
# missing a functional-spec.md or user-guide.md, regardless of whether that
# component was changed in the current push.

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed components
        id: changed
        run: |
          git diff --name-only HEAD~1 HEAD -- 'dxp/component-service/' \
            | grep -oP 'dxp/component-service/[^/]+' \
            | sort -u > /tmp/changed_dirs.txt
          echo "Changed component directories:"
          cat /tmp/changed_dirs.txt

      - name: Generate documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          call_ai() {
            local prompt="$1"
            curl -sf https://models.inference.ai.azure.com/chat/completions \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg p "$prompt" \
                '{model:"gpt-4o",messages:[{role:"user",content:$p}]}')" \
              | jq -r '.choices[0].message.content'
          }

          for component_dir in dxp/component-service/*/; do
            manifest="${component_dir}manifest.json"
            [ -f "$manifest" ] || continue

            component_name=$(jq -r '.displayName // .name' "$manifest")
            was_changed=false
            grep -qF "$component_dir" /tmp/changed_dirs.txt && was_changed=true

            spec_file="${component_dir}functional-spec.md"
            guide_file="${component_dir}user-guide.md"
            missing_spec=false
            missing_guide=false
            [ ! -f "$spec_file" ] && missing_spec=true
            [ ! -f "$guide_file" ] && missing_guide=true

            # Skip if unchanged and both docs exist
            if ! $was_changed && ! $missing_spec && ! $missing_guide; then
              continue
            fi

            echo "Processing: $component_name ($component_dir)"
            manifest_content=$(cat "$manifest")

            # Generate functional spec if changed or missing
            if $was_changed || $missing_spec; then
              echo "  -> Generating functional spec..."
              spec_prompt="You are a technical writer creating a functional specification for a Squiz Matrix web component called '${component_name}'."
              spec_prompt="${spec_prompt}"$'\n\n'"Based on the manifest.json below, write a clear, structured functional specification covering:"
              spec_prompt="${spec_prompt}"$'\n'"- What the component does and when to use it"
              spec_prompt="${spec_prompt}"$'\n'"- All available properties/fields: title, description, type, default value, whether required"
              spec_prompt="${spec_prompt}"$'\n'"- Custom field types (SquizImage, SquizLink, FormattedText) and what they mean"
              spec_prompt="${spec_prompt}"$'\n'"- Any conditional logic (fields that appear or become required based on other field values)"
              spec_prompt="${spec_prompt}"$'\n'"- Visual/functional variations or named previews"
              spec_prompt="${spec_prompt}"$'\n\n'"Write in Markdown. Be thorough but concise."
              spec_prompt="${spec_prompt}"$'\n\n'"manifest.json:"$'\n'"${manifest_content}"
              spec=$(call_ai "$spec_prompt")
              printf '%s\n' "$spec" > "$spec_file"
            fi

            # Generate user guide if changed or missing
            if $was_changed || $missing_guide; then
              echo "  -> Generating user guide..."
              guide_prompt="You are a technical writer creating a user guide for a content editor (non-developer) who will be editing a Squiz Matrix web component called '${component_name}'."
              guide_prompt="${guide_prompt}"$'\n\n'"Based on the manifest.json below, write a friendly, practical user guide explaining:"
              guide_prompt="${guide_prompt}"$'\n'"- What this component looks like on the page and what it is used for"
              guide_prompt="${guide_prompt}"$'\n'"- Step-by-step instructions for filling in each editable field"
              guide_prompt="${guide_prompt}"$'\n'"- Which fields are required vs optional"
              guide_prompt="${guide_prompt}"$'\n'"- Any conditional fields (e.g. fields that only appear when a specific option is chosen)"
              guide_prompt="${guide_prompt}"$'\n'"- Tips and best practices for getting the best results"
              guide_prompt="${guide_prompt}"$'\n\n'"Avoid technical jargon. Write in Markdown with clear headings and numbered steps where appropriate."
              guide_prompt="${guide_prompt}"$'\n\n'"manifest.json:"$'\n'"${manifest_content}"
              guide=$(call_ai "$guide_prompt")
              printf '%s\n' "$guide" > "$guide_file"
            fi
          done

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dxp/component-service/*/functional-spec.md \
                  dxp/component-service/*/user-guide.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
          else
            git commit -m "docs: auto-generate component functional specs and user guides [skip ci]"
            git push
          fi
