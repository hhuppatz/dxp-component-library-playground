name: Reset Component Documentation

on:
  workflow_dispatch:

# Deletes the docs/COMPONENT/ folder for every component, commits the deletion,
# then explicitly triggers the Generate Component Documentation workflow to
# regenerate all docs from scratch.

jobs:
  reset-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete all component documentation folders
        run: |
          for component_dir in dxp/component-service/*/; do
            component=$(basename "$component_dir")
            if [ -d "docs/${component}" ]; then
              rm -rf "docs/${component}"
              echo "Deleted docs/${component}/"
            fi
          done

      - name: Commit and push deletions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No documentation folders found to delete."
          else
            git commit -m "docs: reset all component documentation [skip ci]"
            git push
          fi

      - name: Trigger Generate Component Documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run generate-component-docs.yml --ref ${{ github.ref_name }}
